<section class="wrap" style="padding-bottom:8px">
<h1 style="margin:0 0 8px;font-size:40px;letter-spacing:-0.02em">Closure and detour map</h1>
<p style="margin:0;font-size:18px;color:#33504c;max-width:640px;line-height:1.5">Pick a closure to see its dates and the detour to use.</p>
</section>

<section class="wrap" style="padding-top:20px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<div style="flex:1 1 340px;max-width:420px;min-width:0;display:flex;flex-direction:column;gap:16px">
<div id="closures" role="group" aria-label="Closures" style="display:flex;flex-direction:column;gap:10px"></div>
<div class="card" aria-live="polite">
<span class="tag warn">Closed</span>
<h2 id="sel-name" style="margin:12px 0 4px;font-size:22px"></h2>
<p id="sel-meta" style="margin:0 0 12px;color:#4b5a57"></p>
<p style="margin:0 0 4px;font-weight:600">Detour</p>
<p id="sel-detour" style="margin:0 0 16px;line-height:1.55"></p>
<a href="notices.html" style="font-weight:600">Read the notice</a>
</div>
</div>

<div style="flex:2 1 560px;min-width:0" class="card">
<svg viewBox="0 0 640 460" role="img" aria-label="Schematic map of three closed roads in Areas A, B and C, each with a detour" style="width:100%;height:auto;display:block;border-radius:8px">
<rect width="640" height="460" fill="#dfe9e6"/>
<path d="M0 110H640M0 230H640M0 340H640M0 410H640M130 0V460M300 0V460M480 0V460M560 0V460" stroke="#ffffff" stroke-width="16" fill="none"/>

<text x="322" y="226">Jalan Contoh 2</text>
<text x="322" y="336">Jalan Contoh 5</text>
<text x="322" y="406">Lorong Contoh</text>
<text transform="rotate(-90 462 290)" x="462" y="290" text-anchor="middle">Jalan Contoh 3</text>
<text transform="rotate(-90 572 290)" x="572" y="290" text-anchor="middle">Jalan Contoh 4</text>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path id="det1" d="M130 110V230H300V110" stroke="#0f766e" stroke-width="6" stroke-dasharray="9 7"/>
<path id="det2" d="M480 230H560V340H480" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 7"/>
<path id="det3" d="M130 340V410H300V340" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 7"/>
<path id="halo1" d="M130 110H300" stroke="#14302d" stroke-width="16" opacity="1"/>
<path id="halo2" d="M480 230V340" stroke="#14302d" stroke-width="16" opacity="0"/>
<path id="halo3" d="M130 340H300" stroke="#14302d" stroke-width="16" opacity="0"/>
<path d="M130 110H300" stroke="#d97706" stroke-width="9"/>
<path d="M480 230V340" stroke="#d97706" stroke-width="9"/>
<path d="M130 340H300" stroke="#d97706" stroke-width="9"/>
</g>
<g font-family="Public Sans, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
<circle cx="215" cy="84" r="12" fill="#14302d"/><text x="215" y="89">A</text>
<circle cx="508" cy="285" r="12" fill="#14302d"/><text x="508" y="290">B</text>
<circle cx="215" cy="314" r="12" fill="#14302d"/><text x="215" y="319">C</text>

<div style="display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:14px;font-size:14px;color:#33504c;align-items:center">

<span style="display:inline-flex;align-items:center;gap:8px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#14302d"/></svg>Area marker</span>
<span style="margin-left:auto">Schematic map, not to scale</span>
</div>
